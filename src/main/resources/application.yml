spring:
  profiles:
    default: local

  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - "Path=/api/auth/**"
            - id: user-service-users
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - "Path=/api/users/**"
            - id: user-service-cards
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - "Path=/api/cards/**"
            - id: order-service-orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - "Path=/api/orders/**"
            - id: order-service-items
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - "Path=/api/items/**"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
