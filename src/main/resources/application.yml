spring:
  profiles:
    default: local

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - "Path=/auth/**"
            - id: user-service-users
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - "Path=/users/**"
              filters:
                - 'RewritePath=/users/(?<segment>.*), /api/users/$\{segment}'
            - id: user-service-cards
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - "Path=/cards/**"
              filters:
                - 'RewritePath=/cards/(?<segment>.*), /api/cards/$\{segment}'

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    user-url: ${USER_SERVICE_URL:http://localhost:8080}

