services:
  api-gateway:
    build: .
    container_name: api-gateway
    depends_on:
      auth-service-app:
        condition: service_healthy
      user-service-app:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-min-32-characters-long!!}
      AUTH_SERVICE_URL: http://auth-service-app:8081
      USER_SERVICE_URL: http://user-service-app:8080
    ports:
      - "8084:8084"

  auth-service-app:
    build: ../auth-service
    container_name: auth-service-app
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: auth_service
      DB_PASSWORD: auth_service
      DB_URL: jdbc:postgresql://auth-postgres:5432/auth_service
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-min-32-characters-long!!}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service-app:
    build: ../user-service
    container_name: user-service-app
    depends_on:
      user-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: user_service
      DB_PASSWORD: user_service
      DB_URL: jdbc:postgresql://user-postgres:5432/user_service
      REDIS_HOST: redis
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:18-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
      POSTGRES_DB: auth_service
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-postgres:
    image: postgres:18-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: user-service-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-postgres-data:
  user-postgres-data:
